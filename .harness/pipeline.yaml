pipeline:
  name: harness-shop-build-deploy
  identifier: harness_shop_build_deploy
  projectIdentifier: francis
  orgIdentifier: default
  description: Scan, test, build and push the Harness Shop image, then deploy it to GKE and print the app URL
  tags:
    app: harness-shop
  properties:
    ci:
      codebase:
        repoName: harness-gke-demo
        build: <+input>
  variables:
    - name: image_tag
      type: String
      description: Image tag pushed by CI and deployed by CD
      required: false
      value: 1.0.<+pipeline.sequenceId>
  stages:
    - stage:
        name: Build and Secure
        identifier: build_and_secure
        description: Secret scan, dependency scan, unit tests, then build and push to Docker Hub
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: connector_K8sCluster_fm
              namespace: build
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - parallel:
                  - step:
                      type: Gitleaks
                      name: Secret Scan
                      identifier: secret_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                        advanced:
                          log:
                            level: info
                  - step:
                      type: OsvScanner
                      name: Dependency Scan
                      identifier: dependency_scan
                      spec:
                        mode: orchestration
                        config: default
                        target:
                          type: repository
                          detection: auto
                        advanced:
                          log:
                            level: info
                          fail_on_severity: none
              - step:
                  type: Run
                  name: Unit Tests
                  identifier: unit_tests
                  spec:
                    connectorRef: connector_DockerRegistry_fm
                    image: node:22-alpine
                    shell: Sh
                    command: |-
                      set -e
                      node --version
                      npm ci
                      npm test
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Image
                  identifier: build_and_push
                  spec:
                    connectorRef: connector_DockerRegistry_fm
                    repo: francislabsharness/harness-shop
                    tags:
                      - <+pipeline.variables.image_tag>
                      - <+codebase.shortCommitSha>
                    dockerfile: Dockerfile
                    context: .
                    buildArgs:
                      APP_VERSION: <+pipeline.variables.image_tag>
                      GIT_SHA: <+codebase.shortCommitSha>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
    - stage:
        name: Deploy to GKE
        identifier: deploy_to_gke
        description: Rolling deploy to the deploy namespace on GKE
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: harness_shop
          environment:
            environmentRef: gke_demo
            deployToAll: false
            infrastructureDefinitions:
              - identifier: gke_deploy
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deploy
                  identifier: rolling_deploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
              - step:
                  type: ShellScript
                  name: Get App URL
                  identifier: get_app_url
                  timeout: 10m
                  spec:
                    shell: Bash
                    executionTarget: {}
                    delegateSelectors:
                      - francis-delegate
                    source:
                      type: Inline
                      spec:
                        script: |-
                          export KUBECONFIG=${HARNESS_KUBE_CONFIG_PATH}
                          KUBECTL=$(command -v kubectl || ls -1 /opt/harness-delegate/client-tools/kubectl/*/kubectl 2>/dev/null | tail -1)
                          echo "Using kubectl at: $KUBECTL"
                          IP=""
                          for i in $(seq 1 40); do
                            IP=$($KUBECTL -n deploy get svc harness-shop -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
                            [ -n "$IP" ] && break
                            echo "Waiting for LoadBalancer IP... ($i)"
                            sleep 10
                          done
                          if [ -z "$IP" ]; then
                            echo "LoadBalancer IP not assigned yet"
                            exit 1
                          fi
                          app_url="http://${IP}"
                          echo "=============================================="
                          echo " Harness Shop is live: ${app_url}"
                          echo " Version: <+pipeline.variables.image_tag>"
                          echo "=============================================="
                    environmentVariables: []
                    outputVariables:
                      - name: app_url
                        type: String
                        value: app_url
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
            rollbackSteps:
              - step:
                  type: K8sRollingRollback
                  name: Rollback
                  identifier: rollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
